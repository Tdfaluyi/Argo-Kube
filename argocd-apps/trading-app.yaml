apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trading-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Tdfaluyi/Argo-Kube.git
    targetRevision: main
    path: k8s/trading-app
  destination:
    server: https://kubernetes.default.svc
    namespace: trading-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
